name: Build NILKON for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install VLC and Inno Setup
        shell: pwsh
        run: |
          choco install vlc innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files\VideoLAN\VLC\libvlc.dll")) { throw "VLC was not installed" }

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Optional: code signing. Add the repository secrets SIGN_PFX_BASE64 (your .pfx file, base64) and
      # SIGN_PFX_PASSWORD: the app and the installer are then signed, which stops Windows "Smart App Control"
      # (error 4551) and SmartScreen from blocking them on other PCs.
      - name: Prepare signing certificate (only when configured)
        shell: pwsh
        env:
          PFX: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\\cert.pfx", [Convert]::FromBase64String($env:PFX))
            "SIGN_PFX_FILE=$env:RUNNER_TEMP\\cert.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else { Write-Host "No signing certificate configured - the build stays unsigned." }

      - name: Build app and installer
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: python build_release.py

      - name: Zip the portable folder
        shell: pwsh
        run: Compress-Archive -Path dist\NILKON -DestinationPath NILKON_portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NILKON-Windows
          path: |
            installer_output/*.exe
            NILKON_portable.zip
          if-no-files-found: error
